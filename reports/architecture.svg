<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect width="920" height="560" fill="#ffffff"/>

  <text x="26" y="36" font-size="17" font-weight="700" fill="#111827">VecShift — 무중단 임베딩 재색인</text>
  <text x="26" y="57" font-size="12" fill="#6b7280">서비스는 alias 만 본다. 컬렉션은 그 뒤에서 바뀐다.</text>

  <!-- 읽기 경로 -->
  <rect x="26" y="86" width="150" height="58" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="101" y="110" font-size="13" font-weight="600" text-anchor="middle" fill="#1e40af">검색 클라이언트</text>
  <text x="101" y="129" font-size="10.5" text-anchor="middle" fill="#3b82f6">Zipf 질의 · 동시 8</text>

  <path d="M176 115 H 246" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="211" y="107" font-size="10" text-anchor="middle" fill="#3b82f6">① 해석</text>

  <rect x="246" y="86" width="150" height="58" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="321" y="110" font-size="13" font-weight="700" text-anchor="middle" fill="#854d0e">alias: docs_live</text>
  <text x="321" y="129" font-size="10.5" text-anchor="middle" fill="#a16207">가리키는 컬렉션 + 차원</text>

  <path d="M321 144 V 172" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="404" y="163" font-size="10" text-anchor="middle" fill="#3b82f6">② 구체 컬렉션으로 검색</text>

  <!-- 컬렉션 -->
  <rect x="200" y="176" width="240" height="72" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="200" font-size="13" font-weight="600" text-anchor="middle" fill="#15803d">miracl_ko_v1 (현행)</text>
  <text x="320" y="219" font-size="10.5" text-anchor="middle" fill="#16a34a">e5-small · 384 dim · HNSW</text>
  <text x="320" y="237" font-size="10.5" text-anchor="middle" fill="#6b7280">설명에 모델 id 를 심어둔다</text>

  <rect x="506" y="176" width="240" height="72" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="626" y="200" font-size="13" font-weight="600" text-anchor="middle" fill="#7e22ce">miracl_ko_v3 (교체 대상)</text>
  <text x="626" y="219" font-size="10.5" text-anchor="middle" fill="#9333ea">bge-m3 · 1024 dim · HNSW</text>
  <text x="626" y="237" font-size="10.5" text-anchor="middle" fill="#6b7280">서비스와 분리돼 채워진다</text>

  <!-- 스왑 -->
  <path d="M440 212 H 502" stroke="#ca8a04" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ay)"/>
  <text x="471" y="203" font-size="10.5" font-weight="600" text-anchor="middle" fill="#a16207">스왑</text>
  <text x="471" y="230" font-size="10" text-anchor="middle" fill="#a16207">70 ms</text>

  <path d="M502 246 Q 471 276 440 246" stroke="#dc2626" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="471" y="284" font-size="10.5" font-weight="600" text-anchor="middle" fill="#dc2626">롤백 42 ms</text>

  <!-- 재색인 -->
  <text x="26" y="330" font-size="13" font-weight="700" fill="#111827">재색인 파이프라인</text>

  <rect x="26" y="344" width="132" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="92" y="366" font-size="11.5" font-weight="600" text-anchor="middle" fill="#374151">MIRACL 코퍼스</text>
  <text x="92" y="383" font-size="10" text-anchor="middle" fill="#6b7280">티어 샘플 50 K</text>

  <path d="M158 370 H 202" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>

  <rect x="202" y="344" width="132" height="52" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.3"/>
  <text x="268" y="366" font-size="11.5" font-weight="600" text-anchor="middle" fill="#7e22ce">새 모델로 임베딩</text>
  <text x="268" y="383" font-size="10" text-anchor="middle" fill="#9333ea">33 rows/s · 1,520 s</text>

  <path d="M334 370 H 378" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ag)"/>
  <path d="M410 344 V 254" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M410 254 H 620 V 252" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ap)"/>

  <rect x="378" y="344" width="132" height="52" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="444" y="366" font-size="11.5" font-weight="600" text-anchor="middle" fill="#374151">새 모델 적재</text>
  <text x="444" y="383" font-size="10" text-anchor="middle" fill="#6b7280">서비스 영향 없음</text>

  <!-- 쓰기 저널 -->
  <rect x="26" y="420" width="132" height="52" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
  <text x="92" y="442" font-size="11.5" font-weight="600" text-anchor="middle" fill="#c2410c">재색인 중 쓰기</text>
  <text x="92" y="459" font-size="10" text-anchor="middle" fill="#ea580c">라이브에 반영</text>

  <path d="M158 446 H 202" stroke="#ea580c" stroke-width="1.6" marker-end="url(#ao)"/>

  <rect x="202" y="420" width="132" height="52" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
  <text x="268" y="438" font-size="11.5" font-weight="600" text-anchor="middle" fill="#c2410c">저널 (원문)</text>
  <text x="268" y="455" font-size="9.5" text-anchor="middle" fill="#ea580c">벡터가 아니라 원문 —</text>
  <text x="268" y="467" font-size="9.5" text-anchor="middle" fill="#ea580c">벡터는 모델에 묶인다</text>

  <path d="M334 446 H 378" stroke="#ea580c" stroke-width="1.6" marker-end="url(#ao)"/>

  <rect x="378" y="420" width="132" height="52" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
  <text x="444" y="442" font-size="11.5" font-weight="600" text-anchor="middle" fill="#c2410c">따라잡기</text>
  <text x="444" y="459" font-size="10" text-anchor="middle" fill="#ea580c">새 모델로 재임베딩</text>

  <!-- 품질 게이트 -->
  <path d="M510 446 H 556" stroke="#374151" stroke-width="1.8" marker-end="url(#ag)"/>
  <rect x="556" y="408" width="190" height="76" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
  <text x="651" y="430" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0e7490">품질 게이트</text>
  <text x="651" y="448" font-size="10.5" text-anchor="middle" fill="#0891b2">qrels nDCG@10 · ef=512</text>
  <text x="651" y="464" font-size="10.5" text-anchor="middle" fill="#0891b2">0.8890 → 0.9187 유의한 개선</text>
  <text x="651" y="478" font-size="9.5" text-anchor="middle" fill="#6b7280">회귀하면 스왑하지 않는다</text>

  <path d="M651 406 V 256" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#ac)"/>
  <text x="664" y="316" font-size="11" font-weight="600" fill="#0e7490">통과해야 스왑한다</text>
  <text x="664" y="332" font-size="10" fill="#6b7280">회귀하면 v1 그대로 둔다</text>

  <text x="26" y="516" font-size="10.5" fill="#6b7280">① alias 는 컬렉션만 가리킨다. 모델은 컬렉션 설명에서 읽는다 — 모델 교체는 인덱스 교체와 다르다.</text>
  <text x="26" y="533" font-size="10.5" fill="#6b7280">② alias 로 직접 검색하면 클라이언트가 낡은 메타 캐시에 갇힌다. 해석만 하고 구체 컬렉션을 친다.</text>
  <text x="26" y="550" font-size="10.5" fill="#6b7280">③ 따라잡기는 스왑 전에 끝나야 한다. 스왑 뒤에 발견하면 이미 유실이다.</text>

  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3b82f6"/></marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#ca8a04"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#dc2626"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9ca3af"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#ea580c"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9333ea"/></marker>
    <marker id="ac" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#0891b2"/></marker>
  </defs>
</svg>
