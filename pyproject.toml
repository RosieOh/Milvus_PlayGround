[project]
name = "vecshift"
version = "0.1.0"
description = "Milvus 무중단 임베딩 재색인 & 인덱스 튜닝 하네스"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymilvus==3.0.1",
    "typer>=0.15",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# 데이터셋 준비 (MIRACL 다운로드/샘플링)
data = [
    "datasets>=3.0",
    "huggingface-hub>=0.26",
]
# 임베딩 생성 — 무겁다. 필요할 때만 설치한다.
embed = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]

[project.scripts]
vecshift = "vecshift.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vecshift"]
