[project]
name = "vecshift"
version = "0.1.0"
description = "Milvus 무중단 임베딩 재색인 & 인덱스 튜닝 하네스"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymilvus==3.0.1",
    "typer>=0.15",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# 데이터셋 준비 (MIRACL 다운로드/샘플링).
# `datasets` 는 쓰지 않는다 — 5.x 가 로더 스크립트 지원을 없애서 원본 파일을
# 직접 읽도록 바꿨고, 그 결과 의존이 하나 줄었다 (D-013).
data = [
    "huggingface-hub>=0.26",
]
# 임베딩 생성 — 무겁다. 필요할 때만 설치한다.
embed = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]

[project.scripts]
vecshift = "vecshift.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vecshift"]
