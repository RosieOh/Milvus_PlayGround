# VecShift 설정. 코드에 상수를 박지 않는다 — 스윕 재현성의 전제.

milvus:
  uri: "http://localhost:19530"
  token: ""
  db_name: "default"
  timeout_s: 30

dataset:
  name: "miracl-ko"
  hf_corpus: "miracl/miracl-corpus"
  hf_corpus_subset: "ko"
  hf_qrels: "miracl/miracl"
  hf_qrels_subset: "ko"
  # 티어. 0 = 전량(~1.4M). 디스크가 아니라 임베딩 시간이 제약이다(D-004).
  tiers:
    dev: 50000
    main: 500000
    full: 0
  active_tier: "dev"

embedding:
  # v1 = 현행(베이스라인), v2 = 교체 대상. 차원이 달라야 재색인이 현실적이다.
  v1:
    id: "intfloat/multilingual-e5-small"
    dim: 384
    metric: "COSINE"
    query_prefix: "query: "
    passage_prefix: "passage: "
  v2:
    id: "intfloat/multilingual-e5-base"
    dim: 768
    metric: "COSINE"
    query_prefix: "query: "
    passage_prefix: "passage: "
  # v2 와 같은 모델을 fp16 으로. 처리량 +21 % 의 대가로 품질이 얼마나 변하는지
  # 게이트로 판정하기 위한 비교군이다(D-032). 질의·문서 양쪽 모두 fp16.
  v2h:
    id: "intfloat/multilingual-e5-base"
    dim: 768
    metric: "COSINE"
    query_prefix: "query: "
    passage_prefix: "passage: "
    fp16: true
  # D-005 의 스트레치 후보. bge-m3 는 질의에 instruction/접두사를 붙이지 않는다
  # (모델카드: "no longer requires adding instructions to the queries").
  # 기본 max_seq_length 는 8192 인데 e5 와 공정하게 비교하려고 512 로 맞춘다.
  v3:
    id: "BAAI/bge-m3"
    dim: 1024
    metric: "COSINE"
    query_prefix: ""
    passage_prefix: ""
    max_seq_length: 512
    # 실측: batch 8·16 = 32.3 rows/s, 32 = 28.1, 64 = 22.4. 16 이하가 평평한 천장이다.
    batch_size: 16
  batch_size: 64
  normalize: true

collection:
  alias: "docs_live"
  prefix: "miracl_ko"

goldenset:
  # MIRACL ko dev 는 213 질의가 전부다. 임의로 500개를 만들 수 없다 — 사람이
  # 판정한 것만 쓰는 것이 D-001 의 전제이므로 있는 만큼만 쓴다. 0 = 전량.
  size: 0
  split: "dev"
  top_k: 10

# M1 인덱스 스윕. 빌드 파라미터는 재빌드가 필요하고 검색 파라미터는 아니다 —
# 그래서 (빌드 1회) × (검색 N회) 로 묶는다. 20종 이상을 현실적인 시간에 돌리는 전제다.
sweep:
  # 정답(ground truth)은 FLAT 브루트포스다. ANN recall 은 여기 대비로만 정의된다(D-007).
  ground_truth: "FLAT"
  # QPS 는 실행 간 변동이 크다(중앙 15%, 최대 110% — D-021). 반복을 늘리고
  # 중앙값과 함께 폭(min/max)을 남긴다. recall 은 결정적이라 반복이 필요 없다.
  repeats: 9          # 검색 반복 횟수
  warmup: 2           # 측정에서 버릴 예열 횟수
  builds:
    - {name: "ivf_flat-n128",  type: "IVF_FLAT", params: {nlist: 128},
       search: [{nprobe: 1}, {nprobe: 8}, {nprobe: 32}, {nprobe: 128}]}
    - {name: "ivf_flat-n1024", type: "IVF_FLAT", params: {nlist: 1024},
       search: [{nprobe: 1}, {nprobe: 16}, {nprobe: 64}, {nprobe: 256}]}
    - {name: "ivf_sq8-n512",   type: "IVF_SQ8",  params: {nlist: 512},
       search: [{nprobe: 8}, {nprobe: 32}, {nprobe: 128}]}
    # PQ 는 m(서브양자화기 수)이 품질을 지배한다. m=8 하나만 재면 PQ 에 불공정하다 —
    # nprobe 를 아무리 올려도 양자화 손실은 되돌아오지 않기 때문이다(D-018).
    # 384 dim 기준: m=8 → 48차원/8bit, m=48 → 8차원/8bit.
    - {name: "ivf_pq-m8",      type: "IVF_PQ",   params: {nlist: 512, m: 8, nbits: 8},
       search: [{nprobe: 8}, {nprobe: 32}, {nprobe: 128}]}
    - {name: "ivf_pq-m16",     type: "IVF_PQ",   params: {nlist: 512, m: 16, nbits: 8},
       search: [{nprobe: 32}, {nprobe: 128}]}
    - {name: "ivf_pq-m48",     type: "IVF_PQ",   params: {nlist: 512, m: 48, nbits: 8},
       search: [{nprobe: 32}, {nprobe: 128}]}
    - {name: "ivf_pq-m96",     type: "IVF_PQ",   params: {nlist: 512, m: 96, nbits: 8},
       search: [{nprobe: 32}, {nprobe: 128}]}
    - {name: "hnsw-m8",        type: "HNSW",     params: {M: 8, efConstruction: 200},
       search: [{ef: 16}, {ef: 64}, {ef: 256}]}
    - {name: "hnsw-m16",       type: "HNSW",     params: {M: 16, efConstruction: 200},
       search: [{ef: 16}, {ef: 64}, {ef: 256}]}
    - {name: "hnsw-m32",       type: "HNSW",     params: {M: 32, efConstruction: 200},
       search: [{ef: 16}, {ef: 64}, {ef: 256}]}
    # SCANN 도 양자화 기반이라 reorder_k(원본 벡터로 재정렬) 없이는 상한이 막힌다.
    # PQ 의 m 과 같은 종류의 공정성 문제다 — 정련 파라미터를 빼고 재면 안 된다(D-018).
    - {name: "scann-n512",     type: "SCANN",    params: {nlist: 512},
       search: [{nprobe: 8}, {nprobe: 32}, {nprobe: 128},
                {nprobe: 32, reorder_k: 100}, {nprobe: 32, reorder_k: 500},
                {nprobe: 128, reorder_k: 500}]}
    # DISKANN 은 디스크 랜덤 읽기가 지배적이다. 이 장비의 외장 저장 계층은 내장 대비
    # 4k 랜덤 읽기가 8.6배 느리므로(D-010) **부당하게 불리하게 나온다.** 리포트에 명시할 것.
    - {name: "diskann",        type: "DISKANN",  params: {},
       search: [{search_list: 16}, {search_list: 64}, {search_list: 256}]}
